    <link href="../css/style.css" rel="stylesheet" />

  </head>
  <body>
    <header class="header-publico">
      <div class="nav-logo">
        <a href="index.html">X-AUST</a>
      </div>

      <ul class="nav-menu">

        <li><a href="checkIn.php">Check In</a></li>
      </ul>
    </header>
    
    <main class="login-pagina">
      <div class="login-panel">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required />
          </div>
          
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required />
          </div>
          
          <button type="submit" class="btn-submit">Iniciar Sesión</button>
        </form>
        
        <div class="login-redes">
          <p>O inicia sesión con:</p>
          <div class="login-redes-botones">
            <button type="button" class="btn-red google">Google</button>
            <button type="button" class="btn-red facebook">Facebook</button>
            <button type="button" class="btn-red uabc">UABC</button>
          </div>
        </div>
      </div>
    </main>
    
    <script src="../scripts/login.js"></script>
  </body>
